<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CineTune</title>
    <style>
      :root { color-scheme: light; background: #f8f9ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #f8f9ff; }
      #screen { display: block; width: 100%; height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; background: #f8f9ff; }
      #screen[aria-busy="true"] { opacity: .35; transition: opacity .12s ease; }
    </style>
  </head>
  <body>
    <iframe id="screen" title="CineTune" aria-busy="true"></iframe>
    <script src="app.js"></script>
  </body>
</html>
