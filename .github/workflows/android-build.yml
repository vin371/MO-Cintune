name: CineTune Native Android Build

on:
  push:
    paths:
      - 'android/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build Android'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          BUILD_CMD="${{ inputs.build_type || 'assembleDebug' }}"
          ./gradlew :app:$BUILD_CMD --no-daemon

      - name: Locate and Archive APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineTune-Android-APK
          path: artifacts/*.apk
          retention-days: 14

      - name: Release to GitHub (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
