plugins { id 'com.android.application' }

android {
    namespace 'com.cinetune.music'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cinetune.music'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.4'
        def siteUrl = 'https://cinetune-api.onrender.com/cinetune/#home'
        buildConfigField 'String', 'CINETUNE_URL', '"' + siteUrl + '"'
    }
    buildFeatures { buildConfig true }
}
